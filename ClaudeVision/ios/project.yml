name: ClaudeVision
options:
  bundleIdPrefix: com.claudevision
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  objectVersion: 56

packages:
  meta-wearables-dat-ios:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: "0.5.0"

targets:
  ClaudeVision:
    type: application
    platform: iOS
    sources:
      - ClaudeVision
    dependencies:
      - package: meta-wearables-dat-ios
        product: MWDATCore
      - package: meta-wearables-dat-ios
        product: MWDATCamera
    settings:
      base:
        INFOPLIST_FILE: ClaudeVision/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.kiran.visionclaude
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: "N557HSK28Q"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  ClaudeVision:
    build:
      targets:
        ClaudeVision: all
    run:
      config: Debug
